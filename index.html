<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B8585">
<title>Гармония — помощник ЦСОН</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20260721f">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="bloom bloom-1" aria-hidden="true"></div>
<div class="bloom bloom-2" aria-hidden="true"></div>
<div class="bloom bloom-3" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
  <filter id="liquidGlass" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.4" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="app-splash" id="appSplash" aria-hidden="true">
  <div class="splash-core">
    <span class="splash-ring"></span>
    <img src="img/logo-icon.png" alt="" class="splash-logo">
  </div>
  <div class="splash-name">Гармония</div>
  <div class="splash-sub">центр социального обслуживания</div>
</div>
<div class="shell" id="shell" role="main">
  <div class="shell-blobs" aria-hidden="true"><i class="sb1"></i><i class="sb2"></i><i class="sb3"></i><i class="sb4"></i><i class="sb5"></i><i class="sb6"></i><i class="sb7"></i><i class="sb8"></i></div>
  <header class="hdr" id="appHdr" role="banner">
    <div class="hdr-aurora" aria-hidden="true"></div>
    <div class="hdr-snow" id="hdrSnow" aria-hidden="true"></div>
    <div class="hdr-sheen" aria-hidden="true"></div>
    <div class="hdr-blobs" aria-hidden="true"><i class="hb1"></i><i class="hb2"></i><i class="hb3"></i></div>

    <div class="hdr-main">
      <div class="hdr-left">
        <button class="hdr-logo" id="hdrLogo" aria-label="Гармония">
          <img src="img/logo-icon.png" alt="Логотип Гармония">
        </button>
        <div class="hdr-titles">
          <div class="hdr-name">Гармония</div>
          <button class="hdr-city" id="hdrCityBtn" aria-label="Сменить филиал">
            <span id="cityDisplay" aria-live="polite">г. Губкинский</span>
            <span class="hdr-city-caret" aria-hidden="true">▾</span>
          </button>
        </div>
      </div>
      <div class="hdr-right">
        <button class="hdr-ico-btn" id="hdrSearchBtn" aria-label="Поиск услуг">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="hdr-ico-btn" id="hdrBellBtn" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="hdr-bell-badge gone" id="hdrBellBadge">0</span>
        </button>
        <button class="hdr-avatar" id="hdrAvatar" aria-label="Личный кабинет"><span class="hdr-ava-init">?</span></button>
      </div>
    </div>

    <div class="hdr-status-strip" id="hdrStatusStrip">
      <div class="hdr-status" id="hdrStatus"><span class="hdr-status-dot"></span><span class="hdr-status-txt">—</span></div>
      <a class="hdr-call" id="hdrCall" href="#" aria-label="Позвонить в центр">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <span>Позвонить</span>
      </a>
    </div>

    <button class="hdr-next-chip gone" id="hdrNextChip">
      <span class="hnc-ico">📅</span>
      <span class="hnc-txt"><b id="hdrNextTitle"></b><span id="hdrNextSub"></span></span>
      <span class="hnc-arr">→</span>
    </button>

    <div id="cartBadge" class="gone" style="display:none">0</div>
  </header>

  <div class="search-bar gone" id="searchBar" role="search">
    <div class="search-wrap">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <input class="search-inp" id="searchInp" type="search" placeholder="Поиск услуги…" aria-label="Поиск по услугам">
      <button class="search-clear gone" id="searchClear" onclick="clearSearch()" aria-label="Очистить поиск">✕</button>
    </div>
  </div>

  <div class="asst-fs-hdr gone" id="asstFsHdr">
    <span class="asst-fs-title">🤖 Чат-бот «Гармония»</span>
    <button class="asst-fs-close" onclick="closeAssistantFullscreen()" aria-label="Закрыть чат-бот">✕</button>
  </div>

  <div class="chat" id="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="Диалог с чат-ботом"></div>
  <div class="scroll-hint-fade" aria-hidden="true"></div>
  <div class="actions" id="actions" role="region" aria-label="Действия"></div>

  <button id="backBtn" class="gone" style="display:none" aria-hidden="true"></button>

  <nav class="tab-bar" id="tabBar">
    <div class="tb-pill" id="tbPill"></div>
    <button class="tb active" onclick="tabGo('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span id="tbLblHome">Главная</span></button>
    <button class="tb" onclick="tabGo('menu')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span id="tbLblMenu">Услуги</span></button>
    <button class="tb" id="tb_cart" onclick="tabGo('cart')"><div class="tb-cart-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span class="tb-badge gone" id="tbCartBadge">0</span></div><span id="tbLblCart">Корзина</span></button>
    <button class="tb" onclick="tabGo('orders')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span id="tbLblOrders">Заявки</span></button>
    <button class="tb" onclick="tabGo('profile')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="tbLblProfile">Профиль</span></button>
  </nav>

  <div class="cart-panel" id="cartPanel" role="dialog" aria-modal="true" aria-label="Корзина заявки">
    <div class="cart-hdr">
      <h2 id="cartTitleH2">🛒 Корзина заявки</h2>
      <button class="cart-x" onclick="closeCart()" aria-label="Закрыть корзину">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer" id="cartFooter"></div>
    <div class="panel-close-bar"><button class="panel-close-btn" onclick="closeCart()"><span class="pcb-arrow">←</span> <span id="cartCloseLbl">Закрыть и вернуться</span></button></div>
  </div>

  <div class="orders-panel" id="ordersPanel" role="dialog" aria-modal="true" aria-label="Мои заявки">
    <div class="ord-hdr">
      <h2 id="ordersTitleH2">📋 Мои заявки</h2>
      <button class="cart-x" onclick="closeOrdersPanel()" aria-label="Закрыть">✕</button>
    </div>
    <div class="ord-filters" id="ordFilters">
      <button class="of-btn active" data-f="all" onclick="ordFilter('all',this)" id="ordFilterAll">Все</button>
      <button class="of-btn" data-f="orders" onclick="ordFilter('orders',this)" id="ordFilterOrders">🛒 Заявки</button>
      <button class="of-btn" data-f="bookings" onclick="ordFilter('bookings',this)" id="ordFilterBookings">📅 Записи</button>
      <button class="of-btn" data-f="taxi" onclick="ordFilter('taxi',this)" id="ordFilterTaxi">🚕 Такси</button>
    </div>
    <div class="ord-body" id="ordBody"></div>
    <div class="panel-close-bar"><button class="panel-close-btn" onclick="closeOrdersPanel()"><span class="pcb-arrow">←</span> <span id="ordersCloseLbl">Закрыть и вернуться</span></button></div>
  </div>

  <div class="profile-panel" id="profilePanel" role="dialog" aria-modal="true" aria-label="Личный кабинет">
    <div class="prof-blobs" aria-hidden="true"><i class="pb1"></i><i class="pb2"></i><i class="pb3"></i><i class="pb4"></i></div>
    <button class="prof-close" onclick="closeProfilePanel()" aria-label="Закрыть">✕</button>
    <div class="prof-body" id="profBody"></div>
    <div class="panel-close-bar"><button class="panel-close-btn" onclick="closeProfilePanel()"><span class="pcb-arrow">←</span> <span id="profCloseLbl">Закрыть и вернуться</span></button></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoChange(event)">
</div>

<div class="toast" id="toast" role="status" aria-live="assertive"></div>
<script src="js/data.js?v=20260721f"></script>
<script src="js/booking.js?v=20260721f"></script>
<script src="js/db.js?v=20260721f"></script>
<script src="js/extras.js?v=20260721f"></script>
<script src="js/features.js?v=20260721f"></script>
<script src="js/admin.js?v=20260721f"></script>
<script src="js/app.js?v=20260721f"></script>
<script src="js/header.js?v=20260721f"></script>
<script src="js/polish.js?v=20260721f"></script>
</body>
</html>
